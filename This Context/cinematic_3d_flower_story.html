<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপনি আমার শেষ ঠিকানা - 3D Botanical Experience</title>
    
    <!-- Google Fonts for Bengali Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- GSAP for Smooth Timeline Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Hind Siliguri', 'Anek Bangla', sans-serif;
            user-select: none;
            color: #f3e8ff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(18, 7, 33, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(216, 180, 254, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Text Glow Animations */
        .glow-text-pink {
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.6), 0 0 30px rgba(217, 70, 239, 0.4);
        }
        .glow-text-purple {
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.8), 0 0 40px rgba(147, 51, 234, 0.5);
        }

        /* Floating Poems Effect */
        .floating-poem {
            position: absolute;
            pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s ease;
            font-size: 1.1rem;
            color: rgba(243, 232, 255, 0.85);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            font-weight: 300;
        }

        /* Heart Pulse */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.9; filter: drop-shadow(0 0 15px rgba(244,114,182,0.8)); }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 25px rgba(236,72,153,1)); }
        }

        .heart-pulse {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Custom Scrollbar for Controls */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(216, 180, 254, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="w-full h-screen overflow-hidden">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-8">
        
        <!-- Top Bar: Header & Sound Controls -->
        <div class="flex justify-between items-center w-full max-w-6xl mx-auto pointer-events-auto">
            <div class="flex items-center gap-3 glass-panel px-4 py-2 rounded-full">
                <div class="w-3 h-3 rounded-full bg-pink-500 animate-ping"></div>
                <span class="text-xs md:text-sm tracking-wider font-semibold text-purple-200">3D BOTANICAL EXPERIENCE</span>
            </div>

            <!-- Audio & Replay Buttons -->
            <div class="flex items-center gap-3">
                <button id="audio-btn" onclick="toggleAudio()" class="glass-panel p-3 rounded-full hover:bg-white/10 transition-all text-pink-300 flex items-center justify-center">
                    <svg id="sound-off-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                    <svg id="sound-on-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                </button>
                <button onclick="restartExperience()" class="glass-panel px-4 py-2 rounded-full hover:bg-white/10 transition-all text-xs md:text-sm font-medium text-purple-200">
                    পুনরায় দেখুন (Replay)
                </button>
            </div>
        </div>

        <!-- Center Stage Lyrics & Text Animations -->
        <div class="flex-1 flex flex-col justify-center items-center text-center px-4">
            
            <!-- Main Lyric Banner (Phase 3) -->
            <div id="main-lyric-container" class="opacity-0 transform translate-y-8 transition-all duration-1000 max-w-2xl">
                <h1 id="main-lyric" class="text-3xl md:text-6xl font-bold glow-text-pink leading-relaxed tracking-wide text-white">
                    আপনি আমার শেষ ঠিকানা
                </h1>
                <p id="sub-lyric" class="text-sm md:text-lg text-purple-300/80 mt-2 font-light">
                    হৃদয়ের গভীরে ফুটে থাকা এক অনন্ত ভালোবাসা...
                </p>
            </div>

            <!-- Floating Poetic Lines Container -->
            <div id="poetic-lines-wrapper" class="absolute inset-0 pointer-events-none"></div>

            <!-- Phase 4: Thank You Card -->
            <div id="thank-you-card" class="opacity-0 scale-95 pointer-events-none transition-all duration-1000 glass-panel p-8 md:p-12 rounded-3xl max-w-lg mx-auto flex flex-col items-center gap-4">
                <div class="w-16 h-16 text-pink-400 heart-pulse flex items-center justify-center">
                    <svg class="w-full h-full fill-current" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <h2 class="text-3xl md:text-4xl font-bold text-white glow-text-purple">ধন্যবাদ</h2>
                <p class="text-purple-200/90 text-sm md:text-base leading-relaxed">
                    আমার সকল গল্প, সকল অনুভূতি এবং ভালোবাসার পথচলায় সবসময় পাশে থাকার জন্য।
                </p>
                <button onclick="restartExperience()" class="pointer-events-auto mt-4 px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium shadow-lg transition-all transform hover:scale-105">
                    আবার শুরু করুন
                </button>
            </div>
        </div>

        <!-- Bottom Timeline Control Bar -->
        <div class="w-full max-w-3xl mx-auto pointer-events-auto glass-panel p-4 rounded-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center text-xs md:text-sm text-purple-200">
                <span id="phase-indicator" class="font-semibold text-pink-300">ধাপ ১: কাণ্ডের বৃদ্ধি...</span>
                <span id="time-display" class="font-mono text-purple-300/70">00:00</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="relative w-full h-2 bg-purple-950/60 rounded-full overflow-hidden cursor-pointer" onclick="seekTimeline(event)">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-400 w-0 rounded-full transition-all duration-300"></div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-center items-center gap-6 pt-1">
                <button onclick="togglePlayPause()" id="play-pause-btn" class="text-purple-200 hover:text-white transition-colors">
                    <svg id="pause-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="play-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // --- 1. Audio Synthesizer (Ambient Chords & Sound FX) ---
        let audioCtx = null;
        let isAudioPlaying = false;
        let masterGain = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            masterGain.connect(audioCtx.destination);
        }

        function playAmbientChord() {
            if (!audioCtx || !isAudioPlaying) return;
            const frequencies = [130.81, 164.81, 196.00, 246.94, 293.66]; // C major 7th chord (C3, E3, G3, B3, D4)
            frequencies.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // Slow ambient swell
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 3);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 9);
                
                osc.connect(gain);
                gain.connect(masterGain);
                
                osc.start(audioCtx.currentTime + idx * 0.2);
                osc.stop(audioCtx.currentTime + 9);
            });
        }

        function toggleAudio() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioPlaying = !isAudioPlaying;
            
            document.getElementById('sound-off-icon').classList.toggle('hidden', isAudioPlaying);
            document.getElementById('sound-on-icon').classList.toggle('hidden', !isAudioPlaying);
            
            if (isAudioPlaying) {
                playAmbientChord();
                setInterval(() => { if (isAudioPlaying) playAmbientChord(); }, 8000);
            }
        }

        // --- 2. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05020a, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 5;
        controls.maxDistance = 25;

        // --- 3. Lighting ---
        const ambientLight = new THREE.AmbientLight(0x2d124d, 2.5);
        scene.add(ambientLight);

        const mainLight = new THREE.SpotLight(0xff77cc, 4);
        mainLight.position.set(5, 12, 8);
        mainLight.angle = Math.PI / 4;
        mainLight.penumbra = 0.8;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0x38bdf8, 2, 20);
        fillLight.position.set(-6, -2, -4);
        scene.add(fillLight);

        const bloomLight = new THREE.PointLight(0xf472b6, 3, 10);
        bloomLight.position.set(0, 3, 0);
        scene.add(bloomLight);

        // --- 4. 3D Procedural Flower & Stem Construction ---
        const plantGroup = new THREE.Group();
        plantGroup.position.y = -4;
        scene.add(plantGroup);

        // A. Stem Growth Curve
        const stemPoints = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.2, 1.5, 0.1),
            new THREE.Vector3(-0.3, 3.5, -0.2),
            new THREE.Vector3(0.1, 5.5, 0.1),
            new THREE.Vector3(0, 7.0, 0)
        ];
        const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
        
        // Dynamic Stem Mesh
        const stemMaterial = new THREE.MeshStandardMaterial({
            color: 0x15803d,
            roughness: 0.5,
            metalness: 0.1,
            wireframe: false
        });

        // Wireframe Overlay for Cyber/Botanical Aesthetic
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0xa855f7,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });

        let stemMesh, stemWireframe;
        function updateStemGrowth(progress) {
            if (stemMesh) plantGroup.remove(stemMesh);
            if (stemWireframe) plantGroup.remove(stemWireframe);
            if (progress <= 0.01) return;

            // Sub-curve based on progress
            const currentPoints = stemCurve.getPoints(Math.max(10, Math.floor(50 * progress)));
            const subCurve = new THREE.CatmullRomCurve3(currentPoints);
            
            const geom = new THREE.TubeGeometry(subCurve, 64, 0.12 * (1 - progress * 0.3), 12, false);
            stemMesh = new THREE.Mesh(geom, stemMaterial);
            stemWireframe = new THREE.Mesh(geom, wireframeMaterial);
            
            plantGroup.add(stemMesh);
            plantGroup.add(stemWireframe);
        }

        // B. Leaves
        const leafMaterial = new THREE.MeshStandardMaterial({
            color: 0x16a34a,
            roughness: 0.4,
            side: THREE.DoubleSide
        });

        function createLeaf(scale, rotY, rotZ) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.quadraticCurveTo(0.5, 1, 0.8, 2);
            shape.quadraticCurveTo(0, 2.8, 0, 3.5);
            shape.quadraticCurveTo(-0.8, 2, -0.5, 1);
            shape.quadraticCurveTo(0, 0, 0, 0);

            const geom = new THREE.ShapeGeometry(shape);
            const mesh = new THREE.Mesh(geom, leafMaterial);
            mesh.scale.set(scale, scale, scale);
            mesh.rotation.y = rotY;
            mesh.rotation.z = rotZ;
            mesh.rotation.x = 0.3;
            return mesh;
        }

        const leavesGroup = new THREE.Group();
        const leaf1 = createLeaf(0.5, 0.5, -0.6); leaf1.position.set(0.1, 2, 0);
        const leaf2 = createLeaf(0.6, -1.2, 0.7); leaf2.position.set(-0.2, 3.8, 0);
        leavesGroup.add(leaf1, leaf2);
        leavesGroup.scale.set(0, 0, 0);
        plantGroup.add(leavesGroup);

        // C. Flower Head & Petals Blooming Geometry
        const flowerHeadGroup = new THREE.Group();
        flowerHeadGroup.position.set(0, 7.0, 0);
        plantGroup.add(flowerHeadGroup);

        const petals = [];
        const innerPetals = [];
        
        // Petal Geometry Function
        function createPetalGeometry() {
            const geom = new THREE.PlaneGeometry(1.2, 3.5, 16, 16);
            const pos = geom.attributes.position;
            // Curve plane into a 3D petal shape
            for (let i = 0; i < pos.count; i++) {
                const y = pos.getY(i);
                const x = pos.getX(i);
                // Taper top & bottom
                const widthFactor = 1 - Math.pow((y / 1.75), 2) * 0.5;
                pos.setX(i, x * widthFactor);
                // Curve depth
                const z = Math.sin((y + 1.75) / 3.5 * Math.PI) * 0.4 - Math.pow(x, 2) * 0.3;
                pos.setZ(i, z);
            }
            geom.computeVertexNormals();
            // Move pivot to base
            geom.translate(0, 1.75, 0);
            return geom;
        }

        const petalGeom = createPetalGeometry();
        
        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xec4899,
            emissive: 0x831843,
            emissiveIntensity: 0.3,
            roughness: 0.2,
            metalness: 0.1,
            side: THREE.DoubleSide
        });

        const innerPetalMaterial = new THREE.MeshStandardMaterial({
            color: 0xf472b6,
            emissive: 0xbe185d,
            emissiveIntensity: 0.4,
            roughness: 0.3,
            side: THREE.DoubleSide
        });

        // Outer Ring Petals (6 Petals)
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const pivot = new THREE.Group();
            pivot.rotation.y = angle;
            
            const mesh = new THREE.Mesh(petalGeom, petalMaterial);
            mesh.rotation.x = 0.1; // Initial closed state
            pivot.add(mesh);
            
            flowerHeadGroup.add(pivot);
            petals.push(mesh);
        }

        // Inner Ring Petals (3 Petals)
        for (let i = 0; i < 3; i++) {
            const angle = (i / 3) * Math.PI * 2 + 0.5;
            const pivot = new THREE.Group();
            pivot.rotation.y = angle;
            
            const mesh = new THREE.Mesh(petalGeom, innerPetalMaterial);
            mesh.scale.set(0.8, 0.85, 0.8);
            mesh.rotation.x = 0.05;
            pivot.add(mesh);
            
            flowerHeadGroup.add(pivot);
            innerPetals.push(mesh);
        }

        // Stamen & Anthers Center
        const stamenGroup = new THREE.Group();
        const stamenMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
        for (let i = 0; i < 6; i++) {
            const stamenGeom = new THREE.CylinderGeometry(0.02, 0.02, 1.5);
            stamenGeom.translate(0, 0.75, 0);
            const stamen = new THREE.Mesh(stamenGeom, stamenMat);
            stamen.rotation.y = (i / 6) * Math.PI * 2;
            stamen.rotation.x = 0.2;
            
            // Anther tip
            const antherGeom = new THREE.BoxGeometry(0.1, 0.25, 0.1);
            const antherMat = new THREE.MeshBasicMaterial({ color: 0xca8a04 });
            const anther = new THREE.Mesh(antherGeom, antherMat);
            anther.position.y = 1.5;
            stamen.add(anther);
            
            stamenGroup.add(stamen);
        }
        stamenGroup.scale.set(0, 0, 0);
        flowerHeadGroup.add(stamenGroup);

        // --- 5. Magical Floating Particles ---
        const particleCount = 250;
        const particleGeom = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleScales = new Float32Array(particleCount);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 18;
            particlePositions[i + 1] = Math.random() * 12 - 4;
            particlePositions[i + 2] = (Math.random() - 0.5) * 18;
            particleScales[i / 3] = Math.random();
        }

        particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        
        const particleMat = new THREE.PointsMaterial({
            color: 0xf472b6,
            size: 0.12,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeom, particleMat);
        scene.add(particleSystem);

        // --- 6. Poetic Lines & Lyric Data ---
        const BengaliPoems = [
            "তোমার হাসিতে যেন ভোরের প্রথম আলো...",
            "একমুঠো রোদ হয়ে থেকো আমার আকাশে,",
            "তুমিহীন প্রতিটি মুহূর্ত অর্থহীন নির্জনতা,",
            "স্বপ্নের ডানায় ভর করে ভেসে চলি তোমার দিকে,",
            "তোমার মাঝেই খুঁজে পাই সকল শান্তির নীড়..."
        ];

        const poeticContainer = document.getElementById('poetic-lines-wrapper');
        
        function spawnFloatingPoem(text, delay) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-poem glow-text-pink';
                el.innerText = text;
                
                // Random position around center
                const topPct = 20 + Math.random() * 50;
                const leftPct = 10 + Math.random() * 70;
                el.style.top = `${topPct}%`;
                el.style.left = `${leftPct}%`;
                el.style.opacity = '0';
                el.style.transform = 'scale(0.8) translateY(20px)';
                
                poeticContainer.appendChild(el);

                // Animate in and out
                gsap.to(el, {
                    opacity: 1,
                    scale: 1,
                    y: 0,
                    duration: 1.5,
                    onComplete: () => {
                        gsap.to(el, {
                            opacity: 0,
                            y: -30,
                            duration: 2,
                            delay: 2.5,
                            onComplete: () => el.remove()
                        });
                    }
                });
            }, delay);
        }

        // --- 7. Timeline & Growth Orchestration ---
        let timelineProgress = 0;
        let isPlaying = true;
        const totalDuration = 22; // Seconds for total sequence

        const timelineState = {
            stemGrowth: 0,
            leavesScale: 0,
            bloomProgress: 0,
            cameraZ: 16,
            cameraY: 2
        };

        const masterTL = gsap.timeline({
            paused: false,
            onUpdate: updateMasterSequence,
            onComplete: showThankYouStage
        });

        // Step 1: Stem Growth (0 - 6s)
        masterTL.to(timelineState, {
            stemGrowth: 1,
            duration: 6,
            ease: "power1.inOut"
        }, 0);

        // Step 1.5: Leaves unfold (4 - 7s)
        masterTL.to(timelineState, {
            leavesScale: 1,
            duration: 3,
            ease: "back.out(1.7)"
        }, 4);

        // Step 2: Flower Blooms (6 - 12s)
        masterTL.to(timelineState, {
            bloomProgress: 1,
            cameraZ: 11,
            cameraY: 3.5,
            duration: 6,
            ease: "power2.out"
        }, 6);

        // Step 3: Main Lyric "আপনি আমার শেষ ঠিকানা" (11 - 18s)
        masterTL.to('#main-lyric-container', {
            opacity: 1,
            y: 0,
            duration: 1.5,
            ease: "power2.out"
        }, 11);

        // Floating Poems Sequence during blooming & after
        masterTL.add(() => {
            BengaliPoems.forEach((line, idx) => {
                spawnFloatingPoem(line, idx * 2200);
            });
        }, 9);

        // Step 4: Fade Lyric & Transition to Thank You (18 - 22s)
        masterTL.to('#main-lyric-container', {
            opacity: 0,
            y: -20,
            duration: 1.5
        }, 17);

        function updateMasterSequence() {
            const prog = masterTL.progress();
            timelineProgress = prog;
            
            // Update UI Progress Bar & Time
            document.getElementById('progress-bar').style.width = `${prog * 100}%`;
            const currentSec = Math.floor(prog * totalDuration);
            document.getElementById('time-display').innerText = `00:${currentSec < 10 ? '0' + currentSec : currentSec}`;

            // Phase indicator text updates
            const phaseEl = document.getElementById('phase-indicator');
            if (prog < 0.28) {
                phaseEl.innerText = "ধাপ ১: কাণ্ডের অন্বেষণ...";
            } else if (prog < 0.55) {
                phaseEl.innerText = "ধাপ ২: প্রস্ফুটিত পাপড়ি...";
            } else if (prog < 0.82) {
                phaseEl.innerText = "ধাপ ৩: হৃদয়ের বার্তা...";
            } else {
                phaseEl.innerText = "ধাপ ৪: শেষ ঠিকানা...";
            }

            // 1. Update Stem
            updateStemGrowth(timelineState.stemGrowth);

            // 2. Update Leaves
            leavesGroup.scale.setScalar(timelineState.leavesScale);

            // 3. Update Petal Opening
            const bloom = timelineState.bloomProgress;
            petals.forEach((petal, idx) => {
                // Open outwards angle
                petal.rotation.x = THREE.MathUtils.lerp(0.1, 1.25, bloom);
                // Subtle curve curl
                petal.rotation.z = Math.sin(idx + bloom) * 0.1;
            });

            innerPetals.forEach((petal) => {
                petal.rotation.x = THREE.MathUtils.lerp(0.05, 0.95, bloom);
            });

            stamenGroup.scale.setScalar(bloom);

            // Camera movement update
            camera.position.z = timelineState.cameraZ;
            camera.position.y = timelineState.cameraY;
        }

        function showThankYouStage() {
            const card = document.getElementById('thank-you-card');
            card.classList.remove('pointer-events-none');
            gsap.to(card, {
                opacity: 1,
                scale: 1,
                duration: 1.2,
                ease: "back.out(1.2)"
            });
        }

        // --- 8. Timeline Controls (Play/Pause/Seek/Restart) ---
        function togglePlayPause() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                masterTL.play();
                document.getElementById('pause-icon').classList.remove('hidden');
                document.getElementById('play-icon').classList.add('hidden');
            } else {
                masterTL.pause();
                document.getElementById('pause-icon').classList.add('hidden');
                document.getElementById('play-icon').classList.remove('hidden');
            }
        }

        function seekTimeline(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const pct = Math.max(0, Math.min(1, clickX / rect.width));
            
            // Hide Thank You card if seeking back
            const card = document.getElementById('thank-you-card');
            card.classList.add('pointer-events-none');
            card.style.opacity = '0';
            
            masterTL.progress(pct);
            if (!isPlaying) togglePlayPause();
        }

        function restartExperience() {
            const card = document.getElementById('thank-you-card');
            card.classList.add('pointer-events-none');
            card.style.opacity = '0';
            
            gsap.to('#main-lyric-container', { opacity: 0, y: 30, duration: 0.5 });
            poeticContainer.innerHTML = '';
            
            masterTL.restart();
            isPlaying = true;
            document.getElementById('pause-icon').classList.remove('hidden');
            document.getElementById('play-icon').classList.add('hidden');
        }

        // --- 9. Render Loop & Responsiveness ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // Continuous gentle rotation & swaying animation
            plantGroup.rotation.y = Math.sin(elapsedTime * 0.4) * 0.15;
            plantGroup.rotation.z = Math.cos(elapsedTime * 0.3) * 0.03;

            // Particle float up
            const positions = particleGeom.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] += 0.015;
                if (positions[i] > 10) positions[i] = -4;
            }
            particleGeom.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Window Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Animation Loop
        animate();

    </script>
</body>
</html>
