<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার মিষ্টি ছোট বোনের জন্য | ভাইয়ের ভালোবাসা</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- GSAP for Smooth Animation Sequences -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080312;
            font-family: 'Hind Siliguri', 'Anek Bangla', sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(22, 10, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 114, 182, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.7);
        }

        /* Glowing Text Effects */
        .glow-title {
            text-shadow: 0 0 18px rgba(244, 114, 182, 0.8), 0 0 35px rgba(192, 132, 252, 0.6);
        }
        .glow-quote {
            text-shadow: 0 0 14px rgba(253, 242, 248, 0.9), 0 0 25px rgba(236, 72, 153, 0.5);
        }

        /* Pulse Heart Animation */
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(244,114,182,0.8)); }
            50% { transform: scale(1.22); filter: drop-shadow(0 0 28px rgba(236,72,153,1)); }
        }
        .heart-glow {
            animation: heartPulse 1.8s infinite ease-in-out;
        }

        /* Custom Scrollbar for Message Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body class="w-full h-screen overflow-hidden">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-8">
        
        <!-- Header Bar -->
        <div class="flex justify-between items-center w-full max-w-6xl mx-auto pointer-events-auto">
            <div class="flex items-center gap-3 glass-panel px-4 py-2 rounded-full">
                <div class="w-3 h-3 rounded-full bg-pink-400 animate-pulse"></div>
                <span class="text-xs md:text-sm tracking-widest font-semibold text-pink-200 uppercase">My Sister, My Pride</span>
            </div>

            <!-- Audio & Interactive Buttons -->
            <div class="flex items-center gap-3">
                <button id="audio-btn" onclick="toggleAudio()" class="glass-panel p-3 rounded-full hover:bg-white/10 transition-all text-pink-300 flex items-center justify-center">
                    <svg id="sound-off-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                    <svg id="sound-on-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                </button>
                
                <button onclick="triggerLoveBurst()" class="glass-panel px-4 py-2 rounded-full hover:bg-pink-500/20 transition-all text-xs md:text-sm font-medium text-pink-200 flex items-center gap-2">
                    <span class="heart-glow">❤️</span> ভালোবাসা পাঠাও
                </button>
            </div>
        </div>

        <!-- Main Center Content Area: Quotes & Photo Details -->
        <div class="flex-1 flex flex-col justify-center items-center text-center px-4 max-w-4xl mx-auto my-auto pointer-events-none">
            
            <div id="quote-card" class="glass-panel p-6 md:p-10 rounded-3xl transition-all duration-700 transform translate-y-4 opacity-0 pointer-events-auto max-w-2xl border border-pink-500/30">
                <div class="text-pink-400 text-3xl mb-2 font-serif">“</div>
                <h2 id="quote-text" class="text-xl md:text-3xl font-bold text-white glow-quote leading-relaxed mb-4">
                    তোর হাসিতেই আমার পুরো পৃথিবী উজ্জ্বল হয়ে ওঠে।
                </h2>
                <p id="quote-sub" class="text-sm md:text-base text-purple-200/90 font-light">
                    তুই শুধু আমার ছোট বোন নও, তুই আমার জীবনের সবচেয়ে সুন্দর আলো।
                </p>
                <div class="mt-6 flex justify-center items-center gap-2 text-xs text-pink-300/80 tracking-widest font-mono">
                    <span id="card-counter">01</span> / 04 — বড় ভাইয়ের অনুভূতি
                </div>
            </div>

        </div>

        <!-- Bottom Controls: Photo Slider Navigation & Brotherly Promise -->
        <div class="w-full max-w-2xl mx-auto pointer-events-auto flex flex-col items-center gap-4 mb-2">
            
            <!-- Navigation Buttons -->
            <div class="glass-panel px-6 py-3 rounded-full flex items-center gap-6 shadow-2xl">
                <button onclick="prevPhoto()" class="text-pink-300 hover:text-white transition-all transform hover:scale-110">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>

                <div class="flex gap-2" id="dots-container">
                    <!-- Dynamic Dots generated in JS -->
                </div>

                <button onclick="nextPhoto()" class="text-pink-300 hover:text-white transition-all transform hover:scale-110">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Footer Love Note -->
            <p class="text-xs text-purple-300/70 font-light tracking-wide text-center">
                ছবিগুলো ঘোরানোর জন্য মাউস দিয়ে ড্র্যাগ করতে পারো | সব সময় তোর পাশে আছি ❤️
            </p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 1. Audio Synthesizer & Online Audio Track ---
        let isAudioPlaying = false;
        // Emotional relaxing piano music stream
        const bgAudio = new Audio("https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=piano-moment-114476.mp3");
        bgAudio.loop = true;
        bgAudio.volume = 0.5;

        function toggleAudio() {
            isAudioPlaying = !isAudioPlaying;

            const offIcon = document.getElementById('sound-off-icon');
            const onIcon = document.getElementById('sound-on-icon');

            if (offIcon && onIcon) {
                offIcon.classList.toggle('hidden', isAudioPlaying);
                onIcon.classList.toggle('hidden', !isAudioPlaying);
            }

            if (isAudioPlaying) {
                bgAudio.play().catch(e => console.log("Audio play blocked by browser:", e));
            } else {
                bgAudio.pause();
            }
        }

        // --- 2. Data Content (Quotes & Image Links) ---
        const sisterContent = [
            {
                quote: "তোর হাসিতেই আমার পুরো পৃথিবী উজ্জ্বল হয়ে ওঠে, শাওন।",
                sub: "তুই শুধু আমার ছোট বোন নও, তুই আমার জীবনের সবচেয়ে সুন্দর আলো।",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop"
            },
            {
                quote: "মনে রাখিস, জীবনে যাই আসুক না কেন, তোর বড় ভাই সব সময় ছায়ার মতো তোর পাশে আছে।",
                sub: "কোনো ভয় বা দুশ্চিন্তা মন খারাপ করতে পারবে না, যখন তোর ভাই আছে।",
                image: "https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?q=80&w=800&auto=format&fit=crop"
            },
            {
                quote: "কখনো নিজেকে একা ভাববি না, কোনো বাঁধা বা ঝড়ে ভেঙে পড়বি না।",
                sub: "তুই অনেক শক্ত আর সাহসী এক মেয়ে। তোর যেকোনো স্বপ্নের পেছনে আমি আছি।",
                image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=800&auto=format&fit=crop"
            },
            {
                quote: "তুই আমার সবচেয়ে মিষ্টি ও গর্বের ছোট বোন।",
                sub: "তোর প্রতিটি সাফল্য আর পদক্ষেপে আমার মুখ গর্বে ভরে ওঠে। অনেক ভালোবাসিরে বোন!",
                image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800&auto=format&fit=crop"
            }
        ];

        let currentIndex = 0;

        // --- 3. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080312, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 6;
        controls.maxDistance = 18;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x5b21b6, 2.2);
        scene.add(ambientLight);

        const pinkLight = new THREE.PointLight(0xec4899, 4, 20);
        pinkLight.position.set(4, 5, 4);
        scene.add(pinkLight);

        const goldLight = new THREE.PointLight(0xfacc15, 3, 20);
        goldLight.position.set(-5, -2, 3);
        scene.add(goldLight);

        // --- 4. 3D Floating Photo Carousel Construction ---
        const carouselGroup = new THREE.Group();
        scene.add(carouselGroup);

        const textureLoader = new THREE.TextureLoader();
        const photoNodes = [];
        const radius = 4.8;
        const totalItems = sisterContent.length;

        // Decorative 3D Frame Geometry
        const frameGeometry = new THREE.BoxGeometry(2.4, 3.2, 0.1);
        const goldFrameMat = new THREE.MeshStandardMaterial({
            color: 0xf472b6,
            metalness: 0.8,
            roughness: 0.2,
            emissive: 0x831843,
            emissiveIntensity: 0.2
        });

        sisterContent.forEach((item, i) => {
            const angle = (i / totalItems) * Math.PI * 2;
            const pivot = new THREE.Group();

            // Calculate position on cylinder radius
            pivot.position.x = Math.sin(angle) * radius;
            pivot.position.z = Math.cos(angle) * radius;
            pivot.rotation.y = angle;

            // Frame mesh
            const frameMesh = new THREE.Mesh(frameGeometry, goldFrameMat);

            // Picture Mesh inside frame
            const photoGeom = new THREE.PlaneGeometry(2.1, 2.9);
            
            // Load photo texture with fallback color
            const texture = textureLoader.load(item.image, undefined, undefined, () => {
                console.log("Fallback placeholder activated for missing image path.");
            });

            const photoMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            });
            const photoMesh = new THREE.Mesh(photoGeom, photoMat);
            photoMesh.position.z = 0.06;
            frameMesh.add(photoMesh);

            pivot.add(frameMesh);
            carouselGroup.add(pivot);

            photoNodes.push({ pivot, frameMesh });
        });

        // --- 5. Floating Magic Particles & Star Field ---
        const particleCount = 450;
        const particleGeom = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorPalette = [
            new THREE.Color(0xf472b6), // Pink
            new THREE.Color(0xc084fc), // Purple
            new THREE.Color(0xfacc15), // Gold
            new THREE.Color(0x38bdf8)  // Soft Sky Blue
        ];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 25;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 16;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 25;

            const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i * 3] = col.r;
            colors[i * 3 + 1] = col.g;
            colors[i * 3 + 2] = col.b;
        }

        particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const starField = new THREE.Points(particleGeom, particleMat);
        scene.add(starField);

        // --- 6. Love Burst Heart Particles System ---
        const heartBurstGroup = new THREE.Group();
        scene.add(heartBurstGroup);

        function triggerLoveBurst() {
            const burstCount = 40;
            for (let i = 0; i < burstCount; i++) {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(0, 0.3, -0.3, 0.6, -0.6, 0.6);
                shape.bezierCurveTo(-1, 0.6, -1, 0.1, -1, 0.1);
                shape.bezierCurveTo(-1, -0.3, -0.4, -0.7, 0, -1);
                shape.bezierCurveTo(0.4, -0.7, 1, -0.3, 1, 0.1);
                shape.bezierCurveTo(1, 0.6, 0.6, 0.6, 0.6, 0.6);
                shape.bezierCurveTo(0.3, 0.6, 0, 0.3, 0, 0);

                const geom = new THREE.ShapeGeometry(shape);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xf472b6,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9
                });
                const heartMesh = new THREE.Mesh(geom, mat);
                heartMesh.scale.setScalar(0.12 + Math.random() * 0.1);

                heartMesh.position.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2);
                heartBurstGroup.add(heartMesh);

                // Animate outwards
                gsap.to(heartMesh.position, {
                    x: (Math.random() - 0.5) * 10,
                    y: 3 + Math.random() * 5,
                    z: (Math.random() - 0.5) * 10,
                    duration: 2.5 + Math.random() * 1.5,
                    ease: "power2.out"
                });
                gsap.to(heartMesh.material, {
                    opacity: 0,
                    duration: 2.5 + Math.random() * 1.5,
                    onComplete: () => heartMesh.remove()
                });
            }
        }

        // --- 7. Navigation & Slide Logic ---
        function updateDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            sisterContent.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `w-3 h-3 rounded-full transition-all cursor-pointer ${idx === currentIndex ? 'bg-pink-400 scale-125 shadow-lg shadow-pink-500/50' : 'bg-purple-900/80 hover:bg-pink-300/50'}`;
                dot.onclick = () => goToPhoto(idx);
                container.appendChild(dot);
            });
        }

        function updateUI(index) {
            const card = document.getElementById('quote-card');
            gsap.to(card, {
                opacity: 0,
                y: 15,
                duration: 0.35,
                onComplete: () => {
                    document.getElementById('quote-text').innerText = sisterContent[index].quote;
                    document.getElementById('quote-sub').innerText = sisterContent[index].sub;
                    document.getElementById('card-counter').innerText = `0${index + 1}`;
                    gsap.to(card, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" });
                }
            });

            // Rotate 3D Carousel to target item angle
            const targetAngle = -(index / totalItems) * Math.PI * 2;
            gsap.to(carouselGroup.rotation, {
                y: targetAngle,
                duration: 1.2,
                ease: "power2.inOut"
            });

            // Scale active photo frame
            photoNodes.forEach((node, i) => {
                const isActive = i === index;
                gsap.to(node.frameMesh.scale, {
                    x: isActive ? 1.15 : 0.85,
                    y: isActive ? 1.15 : 0.85,
                    z: isActive ? 1.15 : 0.85,
                    duration: 0.8
                });
            });

            updateDots();
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % totalItems;
            updateUI(currentIndex);
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + totalItems) % totalItems;
            updateUI(currentIndex);
        }

        function goToPhoto(index) {
            currentIndex = index;
            updateUI(currentIndex);
        }

        // --- 8. Animation & Render Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Gently float star particles
            const pos = particleGeom.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                pos[i] += Math.sin(elapsedTime + i) * 0.003;
            }
            particleGeom.attributes.position.needsUpdate = true;

            // Gentle sway of carousel frames
            photoNodes.forEach((node, i) => {
                node.frameMesh.position.y = Math.sin(elapsedTime * 1.5 + i) * 0.15;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Window Resize Event
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initial Trigger
        updateDots();
        setTimeout(() => updateUI(0), 400);
        animate();

    </script>
</body>
</html>
