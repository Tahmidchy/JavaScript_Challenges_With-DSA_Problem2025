<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Botanical Flower - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0514;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #d1b3ff;
            pointer-events: none;
        }
        .ui-overlay h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .ui-overlay p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
    <!-- Load Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>LILIUM ORIENTALIS</h1>
        <p>STAGE 03 // 3D BOTANICAL SPECIMEN REVEAL</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0514, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x331144, 1.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff66cc, 2, 50);
        pointLight.position.set(2, 8, 5);
        scene.add(pointLight);

        const blueLight = new THREE.PointLight(0x00ffff, 1.5, 50);
        blueLight.position.set(-5, -2, -2);
        scene.add(blueLight);

        // Flower Group
        const flowerGroup = new THREE.Group();
        scene.add(flowerGroup);

        // Petal Parametric Function
        function petalFunction(u, v, target) {
            const uRad = u * Math.PI;
            const vRad = v * Math.PI * 2;

            // Parametric equations for petal curvature
            const r = Math.sin(uRad) * (1 + 0.2 * Math.cos(vRad));
            const x = r * Math.cos(vRad) * 1.5;
            const y = u * 4 - Math.pow(u, 2) * 1.5;
            const z = r * Math.sin(vRad) * 0.8 + Math.pow(u, 2) * 0.5;

            target.set(x, y, z);
        }

        // Material for Petals
        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xcc33aa,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide,
            wireframe: false,
            emissive: 0x220011
        });

        // Generate Petals
        const petalGeometry = new THREE.ParametricGeometry(petalFunction, 30, 30);
        const petalCount = 6;

        for (let i = 0; i < petalCount; i++) {
            const petal = new THREE.Mesh(petalGeometry, petalMaterial);
            const angle = (i / petalCount) * Math.PI * 2;
            
            petal.rotation.y = angle;
            petal.rotation.x = 0.3;
            petal.rotation.z = 0.1;
            petal.position.y = 1;

            flowerGroup.add(petal);
        }

        // Stem
        const stemGeometry = new THREE.CylinderGeometry(0.15, 0.2, 8, 16);
        const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.6 });
        const stem = new THREE.Mesh(stemGeometry, stemMaterial);
        stem.position.y = -3;
        flowerGroup.add(stem);

        // Particles Background
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 200;
        const posArray = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 20;
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xdd99ff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeo, particleMat);
        scene.add(particlesMesh);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Gentle rotation animation
            flowerGroup.rotation.y += 0.005;
            particlesMesh.rotation.y -= 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
